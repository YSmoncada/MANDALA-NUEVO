services:
  # ==========================================
  # 1. BACKEND (FastAPI - Python)
  # ==========================================
  - type: web
    name: mandala-backend
    runtime: python
    rootDir: MANDALA_FASTAPI
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Opcional: Descomenta si usas la base de datos PostgreSQL de abajo
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: mandala-db
      #     property: connectionString

  # ==========================================
  # 2. FRONTEND (Expo Web / React Native Web)
  # ==========================================
  - type: static
    name: mandala-frontend
    rootDir: mandala-frontend-mobile
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false # Ingresa aquí https://mandala-backend.onrender.com/api
